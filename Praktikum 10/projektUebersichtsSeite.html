<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="css/main.css">
        <link rel="stylesheet" href="css/projektUebersichtsSeite.css">
        <title>Projekt Übersichts Seite</title>
        <meta charset="UTF-8">
        <meta name="description" content="Projektverwaltungsanwendung">
        <meta name="author" content="Christian Dück, Elias Kehne">
        <script src="scripts/translation.js"></script>
        <script src="scripts/all.js"></script>
    </head>
    <body>
        <header>
            <picture>
                <source media=" (min-width: 1920px) " srcset="assets/header1920x200.png">
                <source media=" (min-width: 1280px) " srcset="assets/header1280x133.png">
                <source media=" (min-width: 640px) " srcset="assets/header640x67.png">
                <img src="assets/header320x34.png" alt="header">
            </picture>
            <form id="login-form">
                <h3 id="login-text">Login</h3>
                <label for="username">Username</label>
                <input type="text" name="username">
                <label for="password">Password</label>
                <input type="password" name="password">
                <input type="submit" value="Submit">
            </form>
            <form id="logout-form" style="display: none">
                <input type="submit" value="Logout">
            </form>
        </header>
        <nav>
            <a href="startseite.html" id="nav-link"><img src="assets/startseite.svg" width="50" height="50"></a>
            <a href="projektUebersichtsseite.html" id="nav-link" name="NavProject">Projekte</a>
            <a href="projektErstellung.html" id="nav-link" name="NavNewProject">Neues Projekt</a>
        </nav>

        <h1>Projekt-Übersichtsseite</h1>

        <div id="filter">Filter
            <div id="filter-options">
                <input type="checkbox" name="filter"> Rezension erhalten

                <input type="radio" name="status-filter" checked> In Bearbeitung
                <input type="radio" name="status-filter"> Fertig

                <fieldset>
                    <legend>Sortieren nach Anfangsdatum</legend>
                    <input type="radio" name="datum-filter" id="datum-neu" value="datum-neu" checked> Neuste Zuerst
                    <input type="radio" name="datum-filter" id="datum-alt" value="datum-alt"> Älteste Zuerst
                </fieldset>

                <fieldset>
                    <legend>Sortieren nach Laufzeit</legend>
                    <input type="radio" name="laufzeit-filter" id="laufzeit-lang" value="laufzeit-lang"> Längste Zuerst
                    <input type="radio" name="laufzeit-filter" id="laufzeit-kurz" value="laufzeit-kurz"> Kürzeste Zuerst
                </fieldset>
            </div>
        </div>

        <ul id="projektListe">

        </ul>
        <footer>
            <a href="https://store.steampowered.com/legal/?l=german">Impressum</a>
            <a href="https://store.steampowered.com/privacy_agreement/">Datenschutzerklärung</a>
            <a href="https://store.steampowered.com/subscriber_agreement/">Haftungsausschuss</a>
            <a href="https://store.steampowered.com/legal/?l=german">Copyright</a>
            <a href="https://help.steampowered.com/de/">Kontakt</a>
        </footer>
        <a href="#" id="startlink">Zurück zum Start</a>
    </body>
</html>
