<!DOCTYPE html>
<html>
    <head>
        <title>Projekt Erstellung</title>
        <meta charset="UTF-8">
        <meta name="description" content="Projektverwaltungsanwendung">
        <meta name="author" content="Christian Dück, Elias Kehne">
    </head>
    <body>
        <header>
            <picture>
                <source media=" (min-width: 1920px) " srcset="assets/header1920x200.png">
                <source media=" (min-width: 1280px) " srcset="assets/header1280x133.png">
                <source media=" (min-width: 640px) " srcset="assets/header640x67.png">
                <img src="assets/header320x34.png" alt="header">
            </picture>
        </header>
        <a href="startseite.html"><img src="assets/startseite.svg" width="50" height="50"></a>
        <a href="projektUebersichtsseite.html">Projekte</a>
        <a href="projektErstellung.html">Neues Projekt</a>

        <h1>Projekterstellung</h1>

        <form action="blanco.html">
            <label>Projekttitel</label>
            <input type="text" name="Projekttitel">
            <br>
            <label>Startdatum</label>
            <input type="date" name="Startdatum ">
            <br>
            <label>Enddatum</label>
            <input type="date" name="Enddatum">
            <br>
            <label>Kurzbeschreibung</label>
            <input type="text" name="Kurzbeschreibung">
            <br>
            <label>Langbeschreibung</label>
            <input type="text" name="Langbeschreibung">
            <br>
            <label>Projektziel1</label>
            <input type="text" name="Projektziel">
            <br>
            <label>Projektziel2</label>
            <input type="text" name="Projektziel">
            <br>
            <label>Logo</label>
            <input type="file" name="logo">
            <br>

            <input type="submit" value="Submit">
        </form>

        <h3>Login</h3>
        <form action="blanco.html">
            <input type="text" name="username">
            <input type="password" name="password">
            <input type="submit" value="Submit">
        </form>
        <footer>
            <a href="https://store.steampowered.com/legal/?l=german">Impressum</a>
            <a href="https://store.steampowered.com/privacy_agreement/">Datenschutzerklärung</a>

            <a href="https://store.steampowered.com/legal/?l=german">Copyright</a>
            <a href="https://help.steampowered.com/de/">Kontakt</a>
            <a href="#">Zurück zum Start</a>
        </footer>
    </body>
</html>
